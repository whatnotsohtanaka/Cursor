<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soh's Prototypes</title>
  <style>
    :root {
      --font: -apple-system, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
      --bg: #f5f5f5;
      --surface: #fff;
      --text: #121212;
      --muted: #6a6a6a;
      --border: #e5e5e5;
      --header: #1d1d1d;
      --accent: #ffe414;
      --link: #0b57d0;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    .top {
      background: var(--header);
      color: rgba(255,255,255,0.92);
      /* Vertical only — horizontal inset lives on .top-inner so it matches .wrap + .card */
      padding: 18px 0 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .top-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .top h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .settings-header-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .settings-header-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.92);
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .settings-header-btn:hover {
      background: rgba(255,255,255,0.16);
    }
    .settings-header-btn:focus-visible {
      outline: 2px solid rgba(255,255,255,0.6);
      outline-offset: 2px;
    }
    .settings-header-btn svg {
      width: 20px;
      height: 20px;
    }
    .settings-header-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 2px var(--header);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .settings-header-badge.is-on {
      opacity: 1;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      /* Same horizontal inset as .top-inner (24px) so title + settings align with card edges */
      padding: 24px 24px 48px;
      width: 100%;
      box-sizing: border-box;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead th {
      text-align: left;
      padding: 16px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    thead th.sortable {
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, color 0.15s;
    }
    thead th.sortable:hover {
      background: #f0f0f0;
      color: var(--text);
    }
    thead th.sortable:focus-visible {
      outline: 2px solid #0b57d0;
      outline-offset: -2px;
    }
    thead th.sort-active {
      color: var(--text);
    }
    thead th .sort-glyph {
      display: inline-block;
      min-width: 1em;
      margin-left: 4px;
      font-size: 11px;
      opacity: 0.9;
    }
    tbody td {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    tbody tr:hover td {
      background: #fcfcfc;
    }
    tbody tr:focus-within td {
      background: #fcfcfc;
    }
    .team-cell {
      white-space: nowrap;
      font-weight: 500;
      color: var(--text);
    }
    .name-link {
      font-weight: 600;
      color: var(--link);
      text-decoration: none;
    }
    .name-link:hover {
      text-decoration: underline;
    }
    .cell-link {
      color: var(--link);
      text-decoration: none;
      font-weight: 500;
    }
    .cell-link:hover {
      text-decoration: underline;
    }
    .empty-cell {
      color: #b0b0b0;
      font-size: 13px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      opacity: 1;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop[hidden] {
      display: none;
    }
    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 12px 48px rgba(0,0,0,0.18);
      border: 1px solid var(--border);
      padding: 20px 22px 18px;
    }
    .modal.modal-wide {
      max-width: 480px;
    }
    .modal-lede {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      margin-top: 4px;
    }
    .settings-list {
      margin: 14px 0 4px;
      max-height: min(52vh, 380px);
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .settings-row:last-child {
      border-bottom: none;
    }
    .settings-row:hover {
      background: rgba(0,0,0,0.03);
    }
    .settings-row-name {
      font-weight: 500;
      color: var(--link);
      text-decoration: none;
      min-width: 0;
      flex: 1;
      text-align: left;
    }
    .settings-row-name:hover {
      text-decoration: underline;
    }
    .settings-row-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .settings-show-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .settings-show-label input {
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .settings-edit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .settings-edit-btn:hover {
      background: rgba(0,0,0,0.06);
      color: var(--text);
    }
    .settings-edit-btn:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
    }
    .settings-edit-btn svg {
      width: 18px;
      height: 18px;
    }
    .empty-table-msg {
      text-align: center;
      padding: 36px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .modal h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: -0.2px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: #fafafa;
      transition: border-color 0.15s, background 0.15s;
    }
    .field input:focus {
      outline: none;
      border-color: #a8a8a8;
      background: var(--surface);
    }
    .field-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
      padding-top: 4px;
    }
    .btn {
      padding: 9px 16px;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #f5f5f5;
    }
    .btn-primary {
      background: var(--header);
      color: #fff;
    }
    .btn-primary:hover {
      background: #333;
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <h1>Soh's Prototypes</h1>
      <div class="settings-header-wrap">
        <span id="settings-badge" class="settings-header-badge" aria-hidden="true"></span>
        <button type="button" class="settings-header-btn" id="settings-open" aria-label="Settings" title="Settings"></button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="card table-scroll">
      <table>
        <thead>
          <tr>
            <th
              scope="col"
              id="th-name"
              class="sortable sort-active"
              tabindex="0"
              data-sort-key="title"
              aria-sort="ascending"
              title="Sort by name — click to toggle A–Z ↔ Z–A"
            >Name<span class="sort-glyph" aria-hidden="true">↑</span></th>
            <th
              scope="col"
              id="th-team"
              class="sortable"
              tabindex="0"
              data-sort-key="team"
              aria-sort="none"
              title="Sort by team — click to toggle A–Z ↔ Z–A"
            >Team<span class="sort-glyph" aria-hidden="true"></span></th>
            <th scope="col">PRD</th>
            <th scope="col">Figma</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div id="settings-backdrop" class="modal-backdrop" hidden>
    <div
      class="modal modal-wide"
      id="settings-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-dialog-title"
    >
      <h2 id="settings-dialog-title">Settings</h2>
      <p class="modal-lede">Show or hide prototypes in the table, or edit title, team, PRD, and Figma links. Open the prototype from the name link.</p>
      <div id="settings-list" class="settings-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="settings-done">Done</button>
      </div>
    </div>
  </div>

  <div id="edit-backdrop" class="modal-backdrop" hidden>
    <div
      class="modal"
      id="edit-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-dialog-title"
    >
      <h2 id="edit-dialog-title">Edit prototype</h2>
      <form id="edit-form">
        <input type="hidden" id="edit-id" />
        <div class="field">
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title" name="title" autocomplete="off" />
        </div>
        <div class="field">
          <label for="edit-team">Team</label>
          <input type="text" id="edit-team" name="team" autocomplete="organization" />
          <p class="field-hint">Leave empty to use automatic team (from name and links).</p>
        </div>
        <div class="field">
          <label for="edit-prd">PRD URL</label>
          <input type="text" id="edit-prd" name="prd" autocomplete="off" placeholder="https://…" />
        </div>
        <div class="field">
          <label for="edit-figma">Figma URL</label>
          <input type="text" id="edit-figma" name="figma" autocomplete="off" placeholder="https://…" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="edit-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="edit-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <!--
    Paths in `href` go up to the repo root then into the project (this file lives in `prototype index/`).
    `deployFolder` is the `pages/st/<name>` segment in design-prototypes (see push-it skill); used when deploying, not by this page UI.
    Optional `team`; if omitted, name/id/href containing "variant" or "template" → "Inventory".
    One row per project: if a folder has multiple versions (v1, v2, hub), link only the latest HTML here.
    Per-browser overrides (title, team, PRD, Figma) live in localStorage under OVERRIDES_KEY.
    Hidden project ids use HIDDEN_IDS_KEY (see Settings in the header).
  -->
  <script>
    const PRD_VARIANTS =
      'https://docs.google.com/document/d/1Hr9BI1rszc3mk-bpH511IIkmtbrsUhWMXqyGSzJ9DbY/edit?tab=t.0#heading=h.j5sk7xjejuu4';
    const PRD_TEMPLATES =
      'https://docs.google.com/document/d/1XgTB1g1TN3eQT-mT_pGFhWmcdzeDAfr4oNBYjimfX1A/edit?tab=t.0#heading=h.uat7go897u7x';
    const PRD_TEMPLATES_CATEGORY_TAB =
      'https://docs.google.com/document/d/1XgTB1g1TN3eQT-mT_pGFhWmcdzeDAfr4oNBYjimfX1A/edit?tab=t.mr4aamoapk2f';

    const FIGMA_VARIANTS_MOBILE =
      'https://www.figma.com/design/Efq06B5ZlyOhHXIKojFhFd/Product-Creation---Management?node-id=15647-103655&m=dev';
    const FIGMA_VARIANTS_DESKTOP =
      'https://www.figma.com/design/Efq06B5ZlyOhHXIKojFhFd/Product-Creation---Management?node-id=19889-301778&m=dev';
    const FIGMA_TEMPLATES_NUX =
      'https://www.figma.com/design/Efq06B5ZlyOhHXIKojFhFd/Product-Creation---Management?node-id=11049-81247&t=g3CBoYb6Jii1v3EA-11';
    const FIGMA_SELECTION_V1 =
      'https://www.figma.com/design/Efq06B5ZlyOhHXIKojFhFd/Product-Creation---Management?node-id=13309-86802&t=EWm9w18TULUlYIQZ-11';
    const FIGMA_LIVE_RUN =
      'https://www.figma.com/design/Efq06B5ZlyOhHXIKojFhFd/Product-Creation---Management?node-id=18983-39043&m=dev';
    const FIGMA_CATEGORY_ASSETS =
      'https://www.figma.com/design/Efq06B5ZlyOhHXIKojFhFd/Product-Creation---Management?node-id=20404-98854&m=dev';
    const FIGMA_LIVE_PRODUCT_CREATION =
      'https://www.figma.com/design/Efq06B5ZlyOhHXIKojFhFd/Product-Creation---Management';

    const PROTOTYPES = [
      {
        id: 'variants-creation-mobile',
        name: 'Variants Creation — Mobile',
        href: '../Variants Creation/index.html',
        deployFolder: 'variants-creation',
        prd: PRD_VARIANTS,
        figma: FIGMA_VARIANTS_MOBILE
      },
      {
        id: 'variants-creation-desktop',
        name: 'Variants Creation — Desktop',
        href: '../Variants Creation/desktop.html',
        deployFolder: 'variants-creation',
        prd: PRD_VARIANTS,
        figma: FIGMA_VARIANTS_DESKTOP
      },
      {
        id: 'live-product-creation',
        name: 'Live Product Creation',
        href: '../Live Product Creation/index.html',
        deployFolder: 'live-product-creation',
        prd: '',
        figma: FIGMA_LIVE_PRODUCT_CREATION
      },
      {
        id: 'live-run-xp',
        name: 'Live Run XP (Templates & Variants)',
        href: '../Live Run XP/index.html',
        deployFolder: 'live-run-xp',
        prd: '',
        figma: FIGMA_LIVE_RUN
      },
      {
        id: 'category-assets-guide',
        name: 'Category Assets Guide',
        href: '../Category Assets Guide/index.html',
        deployFolder: 'category-assets-guide',
        prd: PRD_TEMPLATES_CATEGORY_TAB,
        figma: FIGMA_CATEGORY_ASSETS,
        team: 'Inventory'
      },
      {
        id: 'templates-nux',
        name: 'Templates NUX',
        href: '../Templates NUX/v3.html',
        deployFolder: 'templates-nux',
        prd: PRD_TEMPLATES,
        figma: FIGMA_TEMPLATES_NUX
      },
      {
        id: 'variants-selection-logic',
        name: 'Variants Selection Logic',
        href: '../Variants Selection Logic/v1.html',
        deployFolder: 'variants-selection-logic',
        prd: 'https://docs.google.com/document/d/1Hr9BI1rszc3mk-bpH511IIkmtbrsUhWMXqyGSzJ9DbY/edit?usp=sharing',
        figma: FIGMA_SELECTION_V1
      },
      {
        id: 'variants-management',
        name: 'Variants Management',
        href: '../Variants Management/Variants Management v3.html',
        deployFolder: 'variants-management',
        prd: PRD_VARIANTS,
        figma: ''
      }
    ];

    const OVERRIDES_KEY = 'prototype-index-field-overrides-v1';
    const rowsEl = document.getElementById('rows');
    const thName = document.getElementById('th-name');
    const thTeam = document.getElementById('th-team');
    const editBackdrop = document.getElementById('edit-backdrop');
    const editForm = document.getElementById('edit-form');
    const editId = document.getElementById('edit-id');
    const editTitle = document.getElementById('edit-title');
    const editTeam = document.getElementById('edit-team');
    const editPrd = document.getElementById('edit-prd');
    const editFigma = document.getElementById('edit-figma');
    const editCancel = document.getElementById('edit-cancel');
    const editModal = document.getElementById('edit-modal');
    if (editModal) {
      editModal.addEventListener('click', (e) => e.stopPropagation());
    }

    const settingsBackdrop = document.getElementById('settings-backdrop');
    const settingsModal = document.getElementById('settings-modal');
    const settingsList = document.getElementById('settings-list');
    const settingsOpen = document.getElementById('settings-open');
    const settingsDone = document.getElementById('settings-done');
    if (settingsModal) {
      settingsModal.addEventListener('click', (e) => e.stopPropagation());
    }

    const GEAR_ICON_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>';
    const EDIT_ICON_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>';

    if (settingsOpen) settingsOpen.innerHTML = GEAR_ICON_SVG;

    function getOverridesMap() {
      try {
        const raw = localStorage.getItem(OVERRIDES_KEY);
        const o = raw ? JSON.parse(raw) : {};
        return typeof o === 'object' && o !== null && !Array.isArray(o) ? o : {};
      } catch {
        return {};
      }
    }

    function saveOverridesMap(map) {
      try {
        localStorage.setItem(OVERRIDES_KEY, JSON.stringify(map));
      } catch {
        /* ignore quota */
      }
    }

    /** @param {typeof PROTOTYPES[0]} p */
    function merged(p) {
      const o = getOverridesMap()[p.id];
      if (!o || typeof o !== 'object') {
        return { ...p };
      }
      const out = { ...p };
      if (o.name !== undefined) out.name = String(o.name);
      if (o.prd !== undefined) out.prd = String(o.prd);
      if (o.figma !== undefined) out.figma = String(o.figma);
      if (o.team !== undefined) {
        if (o.team === '') delete out.team;
        else out.team = String(o.team);
      }
      return out;
    }

    /** Effective team label for sorting and display (uses merged name/team/href). */
    function teamLabel(m) {
      if (m.team != null && String(m.team).trim() !== '') {
        return String(m.team).trim();
      }
      const hay = `${m.name} ${m.id} ${m.href || ''}`.toLowerCase();
      if (hay.includes('variant') || hay.includes('template')) {
        return 'Inventory';
      }
      return '—';
    }

    /** Team input value when opening editor: show computed label when no explicit team on merged. */
    function teamInputValue(m, baseP) {
      const o = getOverridesMap()[baseP.id];
      if (o && o.team !== undefined) {
        return o.team === '' ? '' : String(o.team);
      }
      if (baseP.team != null && String(baseP.team).trim() !== '') {
        return String(baseP.team).trim();
      }
      return '';
    }

    /** @type {'title' | 'team'} */
    let sortKey = 'title';
    /** @type {'asc' | 'desc'} */
    let sortDir = 'asc';

    const HIDDEN_IDS_KEY = 'prototype-index-hidden-ids-v1';

    function getHiddenSet() {
      try {
        const raw = localStorage.getItem(HIDDEN_IDS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(arr)) return new Set();
        return new Set(arr.filter((x) => typeof x === 'string'));
      } catch {
        return new Set();
      }
    }

    function saveHiddenSet(set) {
      try {
        localStorage.setItem(HIDDEN_IDS_KEY, JSON.stringify([...set]));
      } catch {
        /* ignore quota */
      }
    }

    function visiblePrototypes() {
      const hid = getHiddenSet();
      return PROTOTYPES.filter((p) => !hid.has(p.id));
    }

    function sortedRows() {
      const dir = sortDir === 'asc' ? 1 : -1;
      const withMerged = visiblePrototypes().map((p) => ({ base: p, m: merged(p) }));
      withMerged.sort((a, b) => {
        let cmp = 0;
        if (sortKey === 'team') {
          cmp = teamLabel(a.m).localeCompare(teamLabel(b.m), undefined, { sensitivity: 'base' });
          if (cmp === 0) {
            cmp = String(a.m.name).localeCompare(String(b.m.name), undefined, { sensitivity: 'base' });
          }
        } else {
          cmp = String(a.m.name).localeCompare(String(b.m.name), undefined, { sensitivity: 'base' });
        }
        return cmp * dir;
      });
      return withMerged.map((x) => x.base);
    }

    function updateSortHeaders() {
      const sortables = [thName, thTeam].filter(Boolean);
      for (const th of sortables) {
        const key = th.dataset.sortKey;
        const active = key === sortKey;
        th.classList.toggle('sort-active', active);
        const glyph = th.querySelector('.sort-glyph');
        if (!active) {
          th.setAttribute('aria-sort', 'none');
          glyph.textContent = '';
        } else {
          th.setAttribute('aria-sort', sortDir === 'asc' ? 'ascending' : 'descending');
          glyph.textContent = sortDir === 'desc' ? '↓' : '↑';
        }
      }
    }

    /** @param {'title' | 'team'} key */
    function applySort(key) {
      if (sortKey === key) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortKey = key;
        sortDir = 'asc';
      }
      updateSortHeaders();
      renderRows();
    }

    function bindSortHeader(th) {
      th.addEventListener('click', () => applySort(th.dataset.sortKey));
      th.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          applySort(th.dataset.sortKey);
        }
      });
    }

    function linkHtml(url, label) {
      if (!url) {
        return '<span class="empty-cell">—</span>';
      }
      const safe = String(url).replace(/"/g, '&quot;');
      const lab = label || 'Open';
      return `<a class="cell-link" href="${safe}" target="_blank" rel="noopener noreferrer">${lab}</a>`;
    }

    function updateSettingsButton() {
      const n = getHiddenSet().size;
      const badge = document.getElementById('settings-badge');
      if (badge) badge.classList.toggle('is-on', n > 0);
      if (settingsOpen) {
        settingsOpen.title = n > 0 ? `Settings — ${n} hidden from table` : 'Settings';
      }
    }

    function renderSettingsList() {
      if (!settingsList) return;
      const hidden = getHiddenSet();
      const rows = [...PROTOTYPES]
        .map((p) => ({ p, m: merged(p) }))
        .sort((a, b) =>
          String(a.m.name).localeCompare(String(b.m.name), undefined, { sensitivity: 'base' })
        );
      settingsList.innerHTML = rows
        .map(({ p, m }) => {
          const checked = !hidden.has(p.id);
          const idEsc = escapeHtml(p.id);
          const nm = escapeHtml(m.name);
          const href = String(m.href).replace(/"/g, '&quot;');
          return `<div class="settings-row">
            <a class="settings-row-name" href="${href}" target="_blank" rel="noopener noreferrer">${nm}</a>
            <div class="settings-row-actions">
              <label class="settings-show-label"><input type="checkbox" data-show-id="${idEsc}" ${checked ? 'checked' : ''} /><span>Show</span></label>
              <button type="button" class="settings-edit-btn" data-edit-id="${idEsc}" aria-label="Edit ${nm}">${EDIT_ICON_SVG}</button>
            </div>
          </div>`;
        })
        .join('');
    }

    function openSettings() {
      renderSettingsList();
      if (settingsBackdrop) settingsBackdrop.hidden = false;
    }

    function closeSettings() {
      if (settingsBackdrop) settingsBackdrop.hidden = true;
    }

    function renderRows() {
      const order = sortedRows();
      if (order.length === 0) {
        rowsEl.innerHTML =
          '<tr><td colspan="4" class="empty-table-msg">Every prototype is hidden. Open <strong>Settings</strong> (gear icon above) to show them again.</td></tr>';
        return;
      }
      rowsEl.innerHTML = order
        .map((p) => {
          const m = merged(p);
          const nameHref = String(m.href).replace(/"/g, '&quot;');
          return `<tr>
            <td><a class="name-link" href="${nameHref}" target="_blank" rel="noopener noreferrer">${escapeHtml(m.name)}</a></td>
            <td class="team-cell">${escapeHtml(teamLabel(m))}</td>
            <td>${linkHtml(m.prd, 'PRD')}</td>
            <td>${linkHtml(m.figma, 'Figma')}</td>
          </tr>`;
        })
        .join('');
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function openEdit(baseId) {
      const p = PROTOTYPES.find((x) => x.id === baseId);
      if (!p) return;
      const m = merged(p);
      editId.value = p.id;
      editTitle.value = m.name;
      editTeam.value = teamInputValue(m, p);
      editPrd.value = m.prd || '';
      editFigma.value = m.figma || '';
      editBackdrop.hidden = false;
      editTitle.focus();
      editTitle.select();
    }

    function closeEdit() {
      editBackdrop.hidden = true;
    }

    editForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = editId.value;
      const p = PROTOTYPES.find((x) => x.id === id);
      if (!p) {
        closeEdit();
        return;
      }
      const title = editTitle.value.trim();
      const teamRaw = editTeam.value.trim();
      const prd = editPrd.value.trim();
      const figma = editFigma.value.trim();

      const map = getOverridesMap();
      const cur = typeof map[id] === 'object' && map[id] !== null ? { ...map[id] } : {};

      if (title !== p.name) cur.name = title;
      else delete cur.name;

      const defaultTeamStr =
        p.team != null && String(p.team).trim() !== '' ? String(p.team).trim() : '';
      if (teamRaw !== defaultTeamStr) {
        cur.team = teamRaw;
      } else {
        delete cur.team;
      }

      if (prd !== (p.prd || '')) cur.prd = prd;
      else delete cur.prd;

      if (figma !== (p.figma || '')) cur.figma = figma;
      else delete cur.figma;

      if (Object.keys(cur).length === 0) {
        delete map[id];
      } else {
        map[id] = cur;
      }
      saveOverridesMap(map);
      closeEdit();
      renderRows();
      updateSortHeaders();
      if (settingsBackdrop && !settingsBackdrop.hidden) {
        renderSettingsList();
      }
      updateSettingsButton();
    });

    editCancel.addEventListener('click', closeEdit);
    editBackdrop.addEventListener('click', (e) => {
      if (e.target === editBackdrop) closeEdit();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!editBackdrop.hidden) {
        closeEdit();
        return;
      }
      if (settingsBackdrop && !settingsBackdrop.hidden) {
        closeSettings();
      }
    });

    if (settingsList) {
      settingsList.addEventListener('change', (e) => {
        const inp = e.target;
        if (inp.type !== 'checkbox' || !inp.dataset.showId || !settingsList.contains(inp)) return;
        const id = inp.dataset.showId;
        const s = getHiddenSet();
        if (inp.checked) s.delete(id);
        else s.add(id);
        saveHiddenSet(s);
        renderRows();
        updateSortHeaders();
        updateSettingsButton();
      });
      settingsList.addEventListener('click', (e) => {
        const btn = e.target.closest('.settings-edit-btn');
        if (!btn || !settingsList.contains(btn)) return;
        e.preventDefault();
        const id = btn.dataset.editId;
        if (!id) return;
        closeSettings();
        openEdit(id);
      });
    }
    if (settingsOpen) settingsOpen.addEventListener('click', openSettings);
    if (settingsDone) settingsDone.addEventListener('click', closeSettings);
    if (settingsBackdrop) {
      settingsBackdrop.addEventListener('click', (e) => {
        if (e.target === settingsBackdrop) closeSettings();
      });
    }

    bindSortHeader(thName);
    bindSortHeader(thTeam);

    updateSortHeaders();
    renderRows();
    updateSettingsButton();
  </script>
</body>
</html>
