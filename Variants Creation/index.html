<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Variants Creation — Mobile Prototype</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f4;
      --surface: #ffffff;
      --border: #e7e5e4;
      --text: #1c1917;
      --text-muted: #78716c;
      --accent: #f97316;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-hover: 0 4px 12px rgba(0,0,0,.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --surface: #1c1917;
        --border: #292524;
        --text: #fafaf9;
        --text-muted: #a8a29e;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 24px;
    }

    .versions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: box-shadow .15s, transform .15s, border-color .15s;
    }

    a:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .label {
      font-weight: 600;
      font-size: 0.9375rem;
    }

    .latest {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-left: 8px;
    }

    .arrow {
      color: var(--text-muted);
      transition: color .15s, transform .15s;
    }

    a:hover .arrow {
      color: var(--accent);
      transform: translateX(2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Variants Creation</h1>
    <p class="subtitle">Mobile prototype — forked from Templates&nbsp;NUX</p>
    <div class="versions">
      <a href="v3.html">
        <span class="label">Version 3 <span class="latest">Latest</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="v2.html">
        <span class="label">Version 2</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="v1.html">
        <span class="label">Version 1</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </div>
</body>
</html>
