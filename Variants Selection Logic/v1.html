<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=393, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Variants Selection Logic - v1</title>
  <style>
    :root {
      --font: -apple-system, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
      --text-primary: #1c1c1c;
      --text-primary-title: #161616;
      --text-secondary: #545454;
      --text-tertiary: #6f6f6f;
      --text-disabled: rgba(0,0,0,0.4);
      --text-inverse: white;
      --text-error: #ce291a;
      --text-positive: #009e52;
      --bg-canvas: #f3f3f3;
      --bg-default: white;
      --bg-inverse: #1c1c1c;
      --bg-subtle: #f3f3f3;
      --bg-extra-subtle: #fafafa;
      --stroke-subtle: rgba(0,0,0,0.05);
      --stroke-container: rgba(0,0,0,0.1);
      --stroke-strong: #aaa;
      --chip-selected-bg: #2d2d2d;
      --chip-default-bg: rgba(0,0,0,0.05);
      --chip-loading-bg: rgba(255,228,20,0.15);
      --chip-loading-border: #ffe414;
      --primary-yellow: #ffe414;
      --card-shadow: 0px 1px 8px 0px rgba(0,0,0,0.04);
      --radius-card: 16px;
      --radius-chip: 8px;
      --radius-rounded: 999px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font);
      background: radial-gradient(ellipse at 85% 10%, rgba(255,255,255,0.06) 0%, transparent 50%), #262626;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .proto-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 0 20px;
      background: #1d1d1d;
      z-index: 10000;
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
    }
    .proto-header.collapsed {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .proto-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .proto-logo {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border-radius: 5px;
      margin-right: 4px;
    }
    .proto-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
    }
    .proto-breadcrumb a {
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      transition: color 0.15s;
    }
    .proto-breadcrumb a:hover { color: rgba(255,255,255,0.6); }
    .proto-breadcrumb .sep { margin: 0 1px; }
    .proto-breadcrumb .current {
      color: rgba(255,255,255,0.8);
      font-weight: 600;
    }
    .proto-divider {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,0.12);
      flex-shrink: 0;
    }
    .proto-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.06);
      transition: background 0.15s, color 0.15s;
      cursor: pointer;
    }
    .proto-link-btn:hover {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }
    .proto-link-btn svg { flex-shrink: 0; }
    .proto-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .proto-timestamp {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.3);
    }
    .proto-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .proto-close-btn:hover {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
    }
    .proto-header-toast {
      position: absolute;
      top: calc(100% + 8px);
      right: 14px;
      padding: 6px 14px;
      border-radius: 8px;
      background: #f9dc00;
      color: #1d1d1d;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font);
      opacity: 0;
      transform: translateY(-4px) scale(0.95);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
      white-space: nowrap;
    }
    .proto-header-toast.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* FAB — shown when header is collapsed */
    .proto-fab {
      position: fixed;
      top: 8px;
      right: 14px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f9dc00;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      z-index: 10001;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35), 0 1px 4px rgba(0,0,0,0.2);
      transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1), box-shadow 0.2s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.6);
    }
    .proto-fab.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    .proto-fab:hover {
      box-shadow: 0 6px 24px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.25);
    }
    .proto-fab:active {
      transform: scale(0.95);
      cursor: grabbing;
    }
    .proto-fab svg {
      color: #1d1d1d;
    }

    /* Notes Overlay + Panel */
    .notes-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .notes-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .notes-panel {
      position: fixed;
      z-index: 200001;
      width: 320px;
      max-height: 50vh;
      background: rgba(50,50,50,0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-6px) scale(0.95);
      transform-origin: top right;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .notes-panel.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .notes-panel-header {
      padding: 10px 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .notes-panel-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
    }
    .notes-panel-close {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      border: none;
      transition: background 0.15s;
    }
    .notes-panel-close:hover {
      background: rgba(255,255,255,0.12);
    }
    .notes-panel-body {
      padding: 0 14px 14px;
      overflow-y: auto;
      flex: 1;
    }
    .notes-panel-content {
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255,255,255,0.65);
      word-break: break-word;
    }
    .notes-panel-content p {
      margin: 0 0 12px;
    }
    .notes-panel-content h4 {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      margin: 14px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .notes-panel-content ul, .notes-panel-content ol {
      margin: 0 0 12px;
      padding-left: 18px;
    }
    .notes-panel-content li {
      margin-bottom: 6px;
    }
    .notes-panel-content ol {
      padding-left: 22px;
    }
    .notes-panel-content strong {
      color: rgba(255,255,255,0.85);
      font-weight: 600;
    }
    .notes-panel-footer {
      padding: 10px 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .notes-panel-footer label {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .notes-panel-footer input[type="checkbox"] {
      accent-color: #FFE414;
      width: 14px;
      height: 14px;
      cursor: pointer;
      margin: 0;
    }

    [data-tip] {
      position: relative;
    }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      padding: 4px 8px;
      border-radius: 5px;
      background: rgba(255,255,255,0.95);
      color: #1d1d1d;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease, transform 0.12s ease;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    [data-tip]:hover::after {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .phone-frame {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phone-bezel {
      position: absolute;
      inset: -8px;
      border-radius: 58px;
      border: 8px solid #2a2a2a;
      border-top-color: #363636;
      background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 30%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 0 0 1.5px #444,
        0 0 0 1px rgba(0,0,0,0.4),
        0 8px 24px rgba(0,0,0,0.35),
        10px 20px 50px rgba(0,0,0,0.5),
        16px 40px 100px rgba(0,0,0,0.4),
        24px 64px 160px rgba(0,0,0,0.3);
      pointer-events: none;
      z-index: 3;
    }

    .device-frame {
      width: 393px;
      height: 852px;
      background: var(--bg-default);
      border-radius: 50px;
      overflow: hidden;
      position: relative;
      z-index: 2;
      cursor: none !important;
    }
    .device-frame * {
      cursor: none !important;
    }

    .proto-cursor {
      position: fixed;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 38%, rgba(255,255,255,0.12), rgba(0,0,0,0.1) 70%);
      border: 1.5px solid rgba(0,0,0,0.18);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 2px 6px rgba(0,0,0,0.1);
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%) scale(1);
      transition: transform 0.1s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.15s ease;
      opacity: 0;
      will-change: transform;
    }
    .proto-cursor.visible { opacity: 1; }
    .proto-cursor.pressed {
      transform: translate(-50%, -50%) scale(0.6);
      background: radial-gradient(circle at 40% 38%, rgba(255,255,255,0.08), rgba(0,0,0,0.18) 70%);
      border-color: rgba(0,0,0,0.3);
    }

    .screen {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .screen::-webkit-scrollbar { display: none; }

    /* iOS Status Bar */
    .status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 54px;
      z-index: 9999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px 0;
    }
    .status-bar .time {
      font-size: 17px;
      font-weight: 590;
      color: white;
      letter-spacing: 0;
    }
    .status-bar-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Image Carousel */
    .image-carousel-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      background: #f0f0f0;
    }
    .image-carousel {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .image-carousel .slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .image-carousel .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }
    .image-carousel .slide img.fading { opacity: 0; }
    .scrim-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 85px;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
      z-index: 2;
    }
    .scrim-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 85px;
      opacity: 0.4;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.056) 11%, rgba(0,0,0,0.113) 21%, rgba(0,0,0,0.171) 30%, rgba(0,0,0,0.23) 38%, rgba(0,0,0,0.29) 45%, rgba(0,0,0,0.351) 52%, rgba(0,0,0,0.414) 58%, rgba(0,0,0,0.479) 64%, rgba(0,0,0,0.546) 69%, rgba(0,0,0,0.615) 74%, rgba(0,0,0,0.686) 79%, rgba(0,0,0,0.76) 84%, rgba(0,0,0,0.837) 89%, rgba(0,0,0,0.917) 95%, rgb(0,0,0) 100%);
      z-index: 2;
    }
    .nav-overlay {
      position: absolute;
      top: 54px; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 12px;
      z-index: 3;
    }
    .nav-btn {
      width: 32px; height: 32px;
      border-radius: 999px;
      background: var(--bg-inverse);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .nav-btn:active { opacity: 0.7; }
    .nav-btn svg { color: white; }

    .page-control {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(32px);
      z-index: 3;
    }
    .page-dot {
      width: 6px; height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.4);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .page-dot.active {
      width: 32px;
      background: white;
    }

    /* Content Section */
    .content-section {
      padding: 16px 16px 0;
      border-bottom: 4px solid var(--stroke-subtle);
      padding-bottom: 32px;
    }
    .popular-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.05);
      backdrop-filter: blur(24px);
      margin-bottom: 8px;
    }
    .popular-badge span {
      font-size: 12px;
      font-weight: 590;
      line-height: 12px;
      color: var(--text-primary);
    }
    .product-title {
      font-size: 18px;
      font-weight: 590;
      line-height: 23px;
      letter-spacing: -0.44px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .product-status {
      font-size: 13px;
      font-weight: 400;
      line-height: 18px;
      letter-spacing: -0.08px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      min-height: 18px;
      transition: color 0.2s ease;
    }
    .product-status.error { color: var(--text-error); }
    .product-status.sold-out { color: var(--text-error); font-weight: 590; }
    .product-status.not-available { color: var(--text-error); font-weight: 590; }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 24px;
      min-height: 21px;
    }
    .price-amount {
      font-size: 16px;
      font-weight: 590;
      line-height: 21px;
      letter-spacing: -0.31px;
      color: var(--text-primary-title);
      opacity: 0.9;
    }
    .price-shipping {
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      color: var(--text-tertiary);
    }

    /* Variant Chips */
    .variant-group {
      margin-bottom: 0;
    }
    .variant-label {
      font-size: 14px;
      font-weight: 590;
      line-height: 19px;
      letter-spacing: -0.15px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .variant-label .required { color: var(--text-error); }
    .error-asterisk { color: var(--text-error); font-weight: 700; }
    .chip-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-left: -16px;
      margin-right: -16px;
      padding-left: 16px;
      padding-right: 16px;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 8px 12px;
      border-radius: var(--radius-chip);
      font-size: 14px;
      font-weight: 590;
      line-height: 19px;
      letter-spacing: -0.15px;
      cursor: pointer;
      border: none;
      outline: none;
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
      font-family: var(--font);
    }
    .chip:active { transform: scale(0.96); }

    .chip.default {
      background: var(--chip-default-bg);
      color: var(--text-primary);
    }
    .chip.selected {
      background: var(--chip-selected-bg);
      color: var(--text-inverse);
    }
    .chip.loading {
      background: var(--chip-selected-bg);
      color: var(--text-inverse);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .chip-spinner {
      display: none;
      width: 10px; height: 10px;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
    .chip.loading .chip-spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chip.disabled-option {
      background: transparent;
      color: var(--text-disabled);
      border: 1px solid rgba(0,0,0,0.12);
      padding: 7px 11px;
      cursor: pointer;
    }
    .chip.disabled-option:active { transform: scale(0.96); }
    .chip.strikethrough {
      background: transparent;
      color: var(--text-disabled);
      border: 1px solid var(--stroke-strong);
      padding: 7px 11px;
      cursor: pointer;
      position: relative;
      overflow: visible;
    }
    .chip.strikethrough::after {
      content: '';
      position: absolute;
      top: 50%; left: -2px;
      width: calc(100% + 4px);
      height: 1px;
      background: var(--stroke-strong);
      transform: rotate(-22deg);
      transform-origin: center;
    }
    .chip.selected.strikethrough {
      background: var(--chip-selected-bg);
      color: var(--text-inverse);
      border: none;
      padding: 8px 12px;
    }
    .chip.selected.strikethrough::after {
      background: rgba(255,255,255,0.5);
    }

    /* Variants Section */
    .variants-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 24px;
    }

    /* Social Proof / Divider */
    .social-section {
      margin-top: 24px;
    }
    .divider {
      height: 1px;
      background: var(--stroke-container);
      margin-bottom: 12px;
    }
    .social-proof-text {
      font-size: 12px;
      line-height: 16px;
      display: flex;
      gap: 4px;
      align-items: center;
      margin-bottom: 12px;
    }
    .social-proof-text .bold {
      font-weight: 590;
      color: var(--text-primary);
    }
    .social-proof-text .muted {
      font-weight: 400;
      color: #7f7f7f;
    }

    /* Bidding + Social Actions */
    .social-actions {
      display: flex;
      gap: 8px;
    }
    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;

  <script>
    // ==========================================
    // DATA MODEL — N-dimension variant system
    // ==========================================
    const PRODUCT = {
      name: 'Nike Dunk Low',
      shipping: 7.50,
      dimensions: [
        { label: 'Size', options: ['9.5M','10M','10.5M','11M','11.5M','12M','12.5M','13M'] },
        { label: 'Color', options: ['Black/White','Brown/White'] }
      ],
      imageKey: 1,
      images: { 'Black/White': 'shoe-black-white.png', 'Brown/White': 'shoe-brown-white.png' },
      variants: {
        '9.5M|Black/White':  { status: 'available', quantity: 55, price: 1, bids: 3 },
        '9.5M|Brown/White':  { status: 'available', quantity: 30, price: 1, bids: 0 },
        '10M|Black/White':   { status: 'available', quantity: 42, price: 1, bids: 7 },
        '10M|Brown/White':   { status: 'available', quantity: 18, price: 2, bids: 0 },
        '10.5M|Black/White': { status: 'available', quantity: 7, price: 1, bids: 1 },
        '10.5M|Brown/White': { status: 'available', quantity: 12, price: 1, bids: 0 },
        '11M|Black/White':   { status: 'available', quantity: 20, price: 1, bids: 12 },
        '11M|Brown/White':   { status: 'sold_out', quantity: 0, price: 1, bids: 0 },
        '11.5M|Black/White': { status: 'not_exist' },
        '11.5M|Brown/White': { status: 'available', quantity: 15, price: 1, bids: 0 },
        '12M|Black/White':   { status: 'available', quantity: 8, price: 1, bids: 0 },
        '12M|Brown/White':   { status: 'available', quantity: 5, price: 1, bids: 2 },
        '12.5M|Black/White': { status: 'available', quantity: 3, price: 1, bids: 0 },
        '12.5M|Brown/White': { status: 'sold_out', quantity: 0, price: 1, bids: 0 },
        '13M|Black/White':   { status: 'not_exist' },
        '13M|Brown/White':   { status: 'available', quantity: 2, price: 1, bids: 5 },
      }
    };

    const LOADING_DELAY_MIN = 600;
    const LOADING_DELAY_MAX = 1200;
    const ERROR_CHANCE = 0.02;

    // ==========================================
    // STATE
    // ==========================================
    let notAvailMode = 'disabled';

    function setNotAvailMode(mode) {
      notAvailMode = mode;
      document.getElementById('radioFillDisabled').style.display = mode === 'disabled' ? 'block' : 'none';
      document.getElementById('radioDotDisabled').style.borderColor = mode === 'disabled' ? '#f9dc00' : 'rgba(255,255,255,0.25)';
      document.getElementById('radioDisabled').style.borderColor = mode === 'disabled' ? 'rgba(249,220,0,0.3)' : 'rgba(255,255,255,0.1)';
      document.getElementById('radioDisabled').style.background = mode === 'disabled' ? 'rgba(249,220,0,0.05)' : 'transparent';
      document.getElementById('radioFillHidden').style.display = mode === 'hidden' ? 'block' : 'none';
      document.getElementById('radioDotHidden').style.borderColor = mode === 'hidden' ? '#f9dc00' : 'rgba(255,255,255,0.25)';
      document.getElementById('radioHidden').style.borderColor = mode === 'hidden' ? 'rgba(249,220,0,0.3)' : 'rgba(255,255,255,0.1)';
      document.getElementById('radioHidden').style.background = mode === 'hidden' ? 'rgba(249,220,0,0.05)' : 'transparent';
      renderAllChips();
    }

    let state = {
      selections: [null, null],
      currentState: 'default',
      loadingChip: null,
      loadingDimIdx: null,
      carouselIdx: 0,
      hasInteracted: false,
    };

    // ==========================================
    // HELPERS
    // ==========================================
    function getVariantKey(vals) { return vals.join('|'); }

    function getVariant(vals) {
      return PRODUCT.variants[getVariantKey(vals)] || { status: 'not_exist' };
    }

    function getStatusesForOption(dimIdx, value) {
      const results = [];
      function recurse(d, keys) {
        if (d === PRODUCT.dimensions.length) { results.push(getVariant(keys)); return; }
        if (d === dimIdx) {
          recurse(d + 1, [...keys, value]);
        } else if (d < dimIdx) {
          if (state.selections[d]) recurse(d + 1, [...keys, state.selections[d]]);
        } else {
          PRODUCT.dimensions[d].options.forEach(o => recurse(d + 1, [...keys, o]));
        }
      }
      recurse(0, []);
      return results;
    }

    function optionIsAllNotExist(dimIdx, value) {
      const vs = getStatusesForOption(dimIdx, value);
      return vs.length > 0 && vs.every(v => v.status === 'not_exist');
    }

    function optionIsAllSoldOut(dimIdx, value) {
      const vs = getStatusesForOption(dimIdx, value);
      return vs.length > 0
        && vs.every(v => v.status === 'sold_out' || v.status === 'not_exist')
        && vs.some(v => v.status === 'sold_out');
    }

    function findFirstAvailableInDim(dimIdx, overrideSelections) {
      const sels = overrideSelections || state.selections;
      for (const opt of PRODUCT.dimensions[dimIdx].options) {
        const test = [...sels];
        test[dimIdx] = opt;
        if (test.every(s => s !== null)) {
          const v = getVariant(test);
          if (v.status === 'available') return opt;
        }
      }
      for (const opt of PRODUCT.dimensions[dimIdx].options) {
        const test = [...sels];
        test[dimIdx] = opt;
        if (test.every(s => s !== null)) {
          const v = getVariant(test);
          if (v.status === 'sold_out') return opt;
        }
      }
      return null;
    }

    function findFirstAvailableCombo() {
      let best = null;
      function recurse(d, keys) {
        if (d === PRODUCT.dimensions.length) {
          const v = getVariant(keys);
          if (!best && v.status === 'available') best = [...keys];
          return;
        }
        for (const opt of PRODUCT.dimensions[d].options) {
          recurse(d + 1, [...keys, opt]);
          if (best) return;
        }
      }
      recurse(0, []);
      return best;
    }

    function randomDelay() {
      return LOADING_DELAY_MIN + Math.random() * (LOADING_DELAY_MAX - LOADING_DELAY_MIN);
    }

    // ==========================================
    // RENDER
    // ==========================================
    function createChip(label, chipClass, onClick) {
      const btn = document.createElement('button');
      btn.className = 'chip ' + chipClass;
      const txt = document.createElement('span');
      txt.textContent = label;
      btn.appendChild(txt);
      const spinner = document.createElement('span');
      spinner.className = 'chip-spinner';
      btn.appendChild(spinner);
      btn.onclick = onClick;
      return btn;
    }

    function renderAllChips() {
      const section = document.getElementById('variantsSection');
      const savedScrolls = [];
      section.querySelectorAll('.chip-row').forEach((r, i) => savedScrolls[i] = r.scrollLeft);
      section.innerHTML = '';
      const rows = [];
      PRODUCT.dimensions.forEach((dim, dIdx) => {
        const group = document.createElement('div');
        group.className = 'variant-group';
        const label = document.createElement('div');
        label.className = 'variant-label';
        label.id = 'dimLabel_' + dIdx;
        label.textContent = dim.label;
        if (dIdx === 0 && state.currentState === 'error') {
          const asterisk = document.createElement('span');
          asterisk.className = 'error-asterisk';
          asterisk.textContent = ' *';
          label.appendChild(asterisk);
        }
        group.appendChild(label);
        const row = document.createElement('div');
        row.className = 'chip-row';
        dim.options.forEach(opt => {
          if (notAvailMode === 'hidden' && optionIsAllNotExist(dIdx, opt)) return;
          row.appendChild(createChip(opt, getChipClass(dIdx, opt), () => selectOption(dIdx, opt)));
        });
        rows.push({ el: row, idx: dIdx });
        group.appendChild(row);
        section.appendChild(group);
      });
      requestAnimationFrame(() => {
        rows.forEach(({ el, idx }) => {
          if (savedScrolls[idx] !== undefined) el.scrollLeft = savedScrolls[idx];
        });
      });
    }

    function getChipClass(dimIdx, value) {
      if (state.loadingChip === value && state.loadingDimIdx === dimIdx) return 'loading';
      if (optionIsAllNotExist(dimIdx, value)) return 'disabled-option';
      if (state.currentState === 'loading') return 'default';
      if (state.selections[dimIdx] === value) {
        return optionIsAllSoldOut(dimIdx, value) ? 'selected strikethrough' : 'selected';
      }
      if (optionIsAllSoldOut(dimIdx, value)) return 'strikethrough';
      return 'default';
    }

    function renderProductInfo() {
      const statusEl = document.getElementById('productStatus');
      const priceEl = document.getElementById('priceAmount');
      const shippingEl = document.getElementById('priceShipping');
      const bidBtn = document.getElementById('preBidBtn');
      const bidInfo = document.getElementById('bidInfo');
      const bidCountEl = document.getElementById('bidCount');
      if (state.currentState === 'loading') return;

      const allSelected = state.selections.every(s => s !== null);
      const variant = allSelected ? getVariant(state.selections) : { status: 'not_exist' };
      const bids = variant.bids || 0;
      const hasBids = bids > 0;

      switch (state.currentState) {
        case 'default':
          statusEl.textContent = `${variant.quantity} Available`;
          statusEl.className = 'product-status';
          priceEl.textContent = `$${variant.price}`;
          shippingEl.textContent = `+ $${PRODUCT.shipping.toFixed(2)} Shipping + Taxes`;
          shippingEl.style.display = '';
          bidInfo.style.display = hasBids ? '' : 'none';
          bidCountEl.textContent = `${bids} Bid${bids !== 1 ? 's' : ''}`;
          bidBtn.disabled = false;
          break;
        case 'error':
          statusEl.textContent = 'There was an error loading this variant.';
          statusEl.className = 'product-status error';
          priceEl.textContent = '—';
          shippingEl.style.display = 'none';
          bidInfo.style.display = 'none';
          bidBtn.disabled = true;
          break;
        case 'sold_out':
          statusEl.textContent = 'Sold Out';
          statusEl.className = 'product-status sold-out';
          priceEl.textContent = variant.price != null ? `$${variant.price}` : '—';
          shippingEl.textContent = `+ $${PRODUCT.shipping.toFixed(2)} Shipping + Taxes`;
          shippingEl.style.display = variant.price != null ? '' : 'none';
          bidInfo.style.display = 'none';
          bidBtn.disabled = true;
          break;
        case 'not_exist':
          statusEl.textContent = 'Not Available';
          statusEl.className = 'product-status not-available';
          priceEl.textContent = '—';
          shippingEl.style.display = 'none';
          bidInfo.style.display = 'none';
          bidBtn.disabled = true;
          break;
      }
      renderVariantTable();
    }

    function updateImages(value) {
      const img = PRODUCT.images[value] || Object.values(PRODUCT.images)[0];
      const slides = document.querySelectorAll('[id^="slideImg"]');
      if (!img || slides[0].src.endsWith(img)) return;
      slides.forEach(s => s.classList.add('fading'));
      setTimeout(() => { slides.forEach(s => { s.src = img; s.classList.remove('fading'); }); }, 300);
    }

    // ==========================================
    // STATE MACHINE
    // ==========================================
    let loadingTimer = null;

    function selectOption(dimIdx, value) {
      if (state.loadingChip) return;
      hideFooterToast();

      if (optionIsAllNotExist(dimIdx, value)) {
        showFooterToast('Option unavailable');
        return;
      }

      if (state.selections[dimIdx] === value && state.currentState !== 'not_exist') return;

      let newSels = [...state.selections];
      newSels[dimIdx] = value;

      for (let d = 0; d < PRODUCT.dimensions.length; d++) {
        if (d !== dimIdx && !newSels[d]) {
          newSels[d] = PRODUCT.dimensions[d].options[0];
        }
      }

      if (newSels.every(s => s !== null) && getVariant(newSels).status === 'not_exist') {
        for (let d = PRODUCT.dimensions.length - 1; d >= 0; d--) {
          if (d === dimIdx) continue;
          const fb = findFirstAvailableInDim(d, newSels);
          if (fb) { newSels[d] = fb; break; }
        }
      }

      if (!state.hasInteracted) {
        state.loadingChip = value;
        state.loadingDimIdx = dimIdx;
        state.currentState = 'loading';
        renderAllChips();
        clearTimeout(loadingTimer);
        loadingTimer = setTimeout(() => {
          state.hasInteracted = true;
          resolveSelection(newSels, dimIdx);
        }, randomDelay());
      } else {
        resolveSelection(newSels, dimIdx);
      }
    }

    function resolveSelection(newSels, changedDimIdx) {
      state.loadingChip = null;
      state.loadingDimIdx = null;
      const variant = getVariant(newSels);
      const simulateError = variant.status === 'available' && Math.random() < ERROR_CHANCE;
      const status = simulateError ? 'error' : variant.status;

      switch (status) {
        case 'available':
          state.selections = newSels;
          state.currentState = 'default';
          updateImages(newSels[PRODUCT.imageKey]);
          break;
        case 'sold_out':
          state.selections = newSels;
          state.currentState = 'sold_out';
          updateImages(newSels[PRODUCT.imageKey]);
          break;
        case 'error':
          renderAllChips();
          showFooterToast('Failed to load');
          return;
        case 'not_exist':
          state.selections = newSels;
          state.currentState = 'not_exist';
          renderAllChips();
          renderProductInfo();
          showFooterToast('Option unavailable');
          return;
      }

      renderAllChips();
      renderProductInfo();
    }

    // ==========================================
    // FOOTER TOAST
    // ==========================================
    let toastTimer = null;
    function showFooterToast(msg) {
      const toast = document.getElementById('footerToast');
      const bar = document.querySelector('.commerce-bar');
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.style.bottom = (bar.offsetHeight + 16) + 'px';
      toast.classList.remove('visible');
      requestAnimationFrame(() => { requestAnimationFrame(() => { toast.classList.add('visible'); }); });
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 3000);
    }
    function hideFooterToast() {
      clearTimeout(toastTimer);
      document.getElementById('footerToast').classList.remove('visible');
    }

    // ==========================================
    // CAROUSEL
    // ==========================================
    let touchStartX = 0, touchDeltaX = 0;
    const carouselWrap = document.getElementById('carouselWrap');
    const carousel = document.getElementById('carousel');

    function handleDragStart(x) { touchStartX = x; carousel.style.transition = 'none'; }
    function handleDragMove(x) {
      touchDeltaX = x - touchStartX;
      carousel.style.transform = `translateX(${-(state.carouselIdx * 393) + touchDeltaX}px)`;
    }
    function handleDragEnd() {
      carousel.style.transition = '';
      if (Math.abs(touchDeltaX) > 50) {
        if (touchDeltaX < 0 && state.carouselIdx < 3) state.carouselIdx++;
        if (touchDeltaX > 0 && state.carouselIdx > 0) state.carouselIdx--;
      }
      touchDeltaX = 0;
      goToSlide(state.carouselIdx);
    }
    carouselWrap.addEventListener('touchstart', e => handleDragStart(e.touches[0].clientX));
    carouselWrap.addEventListener('touchmove', e => handleDragMove(e.touches[0].clientX));
    carouselWrap.addEventListener('touchend', handleDragEnd);
    let mouseDown = false;
    carouselWrap.addEventListener('mousedown', e => { mouseDown = true; handleDragStart(e.clientX); e.preventDefault(); });
    carouselWrap.addEventListener('mousemove', e => { if (mouseDown) handleDragMove(e.clientX); });
    carouselWrap.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false; handleDragEnd(); } });
    carouselWrap.addEventListener('mouseleave', () => { if (mouseDown) { mouseDown = false; handleDragEnd(); } });
    document.querySelectorAll('.page-dot').forEach(dot => {
      dot.addEventListener('click', () => goToSlide(parseInt(dot.dataset.idx)));
    });
    function goToSlide(idx) {
      state.carouselIdx = idx;
      carousel.style.transform = `translateX(${-idx * 393}px)`;
      document.querySelectorAll('.page-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    // ==========================================
    // PRODUCT TEMPLATES
    // ==========================================
    const CATEGORY_TEMPLATES = {
      shoes: [

        ], imageKey: 1, images: { 'Black/White': 'shoe-black-white.png', 'Brown/White': 'shoe-brown-white.png' }, price: [1, 2] },
        { name: 'Jordan 1 Retro High', dims: [

        ], imageKey: 1, images: { 'Black/White': 'shoe-black-white.png', 'Brown/White': 'shoe-brown-white.png' }, price: [2, 5] },

        ], imageKey: 1, images: { 'Black/White': 'shoe-black-white.png', 'Brown/White': 'shoe-brown-white.png' }, price: [1, 2] },
      ],
      electronics: [

        ], imageKey: 0, images: { 'Space Gray': 'headphones-space-gray.png', 'Silver': 'headphones-silver.png' }, price: [3, 7] },

    const CATEGORIES = Object.keys(CATEGORY_TEMPLATES);

    // ==========================================
    // CONTROL PANEL
    // ==========================================
    function tableCell(emoji, active, onclick) {
      const bg = active ? 'background:rgba(249,220,0,0.12);outline:1.5px solid #f9dc00;border-radius:4px;' : '';
      return `<td style="padding:4px;text-align:center;cursor:pointer;${bg}" onclick="${onclick}">${emoji}</td>`;
    }

    function renderVariantTable() {
      const dims = PRODUCT.dimensions;
      const icon = { available: '✅', sold_out: '➖', not_exist: '🚫' };
      const tStyle = 'width:100%;border-collapse:separate;border-spacing:2px;font-size:10px;font-family:var(--font)';
      const thStyle = 'padding:5px 4px;text-align:center;color:rgba(255,255,255,0.35);font-weight:600;white-space:nowrap';

      if (dims.length === 2) {
        let html = `<table style="${tStyle}">`;
        html += `<tr><th style="${thStyle}"></th>`;
        dims[1].options.forEach(c => {
          const short = c.includes('/') ? c.split('/').map(w => w[0]).join('/') : c.slice(0, 4);
          html += `<th style="${thStyle}" data-tip="${c}">${short}</th>`;
        });
        html += '</tr>';
        dims[0].options.forEach(r => {
          const isSel = r === state.selections[0];
          html += `<tr style="background:${isSel ? 'rgba(255,255,255,0.04)' : 'transparent'}">`;
          html += `<td style="padding:4px 6px;color:rgba(255,255,255,${isSel?'0.9':'0.5'});font-weight:${isSel?'700':'500'};white-space:nowrap">${r}</td>`;
          dims[1].options.forEach(c => {
            const v = getVariant([r, c]);
            const active = r === state.selections[0] && c === state.selections[1];
            const esc = (s) => s.replace(/'/g, "\\'");
            html += tableCell(icon[v.status]||'🚫', active, `selectVariantFromTable([${dims[0].options.indexOf(r)},${dims[1].options.indexOf(c)}])`);
          });
          html += '</tr>';
        });
        html += '</table>';
        document.getElementById('variantTable').innerHTML = html;
      } else if (dims.length === 3) {
        const combos = [];
        dims[1].options.forEach(d1 => {
          dims[2].options.forEach(d2 => {
            combos.push({ d1, d2 });
          });
        });

        let html = `<table style="${tStyle}">`;
        html += `<tr><th style="${thStyle}"></th>`;
        combos.forEach(cb => {
          const d1Short = cb.d1.includes('/') ? cb.d1.split('/').map(w => w[0]).join('/') : cb.d1.slice(0, 4);
          const d2Short = cb.d2.includes('/') ? cb.d2.split('/').map(w => w[0]).join('/') : cb.d2.slice(0, 4);
          html += `<th style="${thStyle};font-size:8px;line-height:1.2" data-tip="${cb.d1} + ${cb.d2}">${d1Short}<br>${d2Short}</th>`;
        });
        html += '</tr>';

        dims[0].options.forEach(d0 => {
          const isSel = d0 === state.selections[0];
          html += `<tr style="background:${isSel ? 'rgba(255,255,255,0.04)' : 'transparent'}">`;
          html += `<td style="padding:4px 6px;color:rgba(255,255,255,${isSel?'0.9':'0.5'});font-weight:${isSel?'700':'500'};white-space:nowrap">${d0}</td>`;
          combos.forEach((cb, ci) => {
            const v = getVariant([d0, cb.d1, cb.d2]);
            const active = d0 === state.selections[0] && cb.d1 === state.selections[1] && cb.d2 === state.selections[2];
            const d0i = dims[0].options.indexOf(d0);
            const d1i = dims[1].options.indexOf(cb.d1);
            const d2i = dims[2].options.indexOf(cb.d2);
            html += tableCell(icon[v.status]||'🚫', active, `selectVariantFromTable([${d0i},${d1i},${d2i}])`);
          });
          html += '</tr>';
        });
        html += '</table>';
        document.getElementById('variantTable').innerHTML = html;
      }
    }

    function selectVariantFromTable(indices) {
      const dims = PRODUCT.dimensions;
      indices.forEach((optIdx, dimIdx) => {
        const value = dims[dimIdx].options[optIdx];
        selectOption(dimIdx, value);
      });
    }

    function randomizeVariants() {
      const cat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
      const pool = CATEGORY_TEMPLATES[cat];
      const tpl = pool[Math.floor(Math.random() * pool.length)];

      PRODUCT.name = tpl.name;
      PRODUCT.imageKey = tpl.imageKey;
      PRODUCT.images = { ...tpl.images };
      PRODUCT.dimensions = tpl.dims.map(d => ({ label: d.label, options: [...d.options] }));

      const statuses = ['available', 'available', 'available', 'sold_out', 'not_exist'];
      PRODUCT.variants = {};

      function buildKeys(dIdx, keys) {
        if (dIdx === PRODUCT.dimensions.length) {
          const key = keys.join('|');
          const pick = statuses[Math.floor(Math.random() * statuses.length)];
          if (pick === 'available') {
            const price = tpl.price[0] + Math.floor(Math.random() * (tpl.price[1] - tpl.price[0] + 1));
            const bids = Math.random() < 0.3 ? Math.floor(Math.random() * 20) + 1 : 0;
            PRODUCT.variants[key] = { status: 'available', quantity: Math.floor(Math.random() * 60) + 1, price, bids };
          } else if (pick === 'sold_out') {
            PRODUCT.variants[key] = { status: 'sold_out', quantity: 0, price: tpl.price[0], bids: 0 };
          } else {
            PRODUCT.variants[key] = { status: 'not_exist' };
          }
          return;
        }
        PRODUCT.dimensions[dIdx].options.forEach(opt => buildKeys(dIdx + 1, [...keys, opt]));
      }
      buildKeys(0, []);

      state.selections = new Array(PRODUCT.dimensions.length).fill(null);
      state.currentState = 'default';
      state.loadingChip = null;
      state.loadingDimIdx = null;
      state.hasInteracted = false;

      const combo = findFirstAvailableCombo();
      if (combo) {
        state.selections = combo;
        const v = getVariant(combo);
        state.currentState = v.status === 'available' ? 'default' : v.status;
        updateImages(combo[PRODUCT.imageKey]);
      }

      document.querySelector('.product-title').textContent = PRODUCT.name;
      renderAllChips();
      renderProductInfo();
    }

    function toggleControlPanel() {
      const body = document.getElementById('controlPanelBody');
      const chevron = document.getElementById('collapseChevron');
      if (body.style.display === 'none') { body.style.display = 'flex'; chevron.style.transform = ''; }
      else { body.style.display = 'none'; chevron.style.transform = 'rotate(-90deg)'; }
    }

    // ==========================================
    // PROTOTYPE FINGER CURSOR + SWIPE-TO-SCROLL
    // ==========================================
    (function() {
      const cursor = document.getElementById('protoCursor');
      const device = document.querySelector('.device-frame');
      const screen = document.getElementById('screen');

      device.addEventListener('mouseenter', () => cursor.classList.add('visible'));
      device.addEventListener('mouseleave', () => {
        cursor.classList.remove('visible', 'pressed');
        endSwipe();
      });
      device.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });
      device.addEventListener('mousedown', () => cursor.classList.add('pressed'));
      document.addEventListener('mouseup', () => cursor.classList.remove('pressed'));

      let swiping = false, startY, scrollStart, lastY, lastT, velocity;
      let momentumRaf = null, bounceRaf = null, overscroll = 0;
      const RUBBER = 0.35;
      const MAX_OVER = 120;

      function maxScroll() { return screen.scrollHeight - screen.clientHeight; }

      function applyOverscroll(px) {
        overscroll = Math.max(-MAX_OVER, Math.min(MAX_OVER, px));
        screen.style.transform = overscroll ? `translateY(${overscroll}px)` : '';
      }

      function springBack() {
        cancelAnimationFrame(bounceRaf);
        if (Math.abs(overscroll) < 0.5) { applyOverscroll(0); return; }
        function tick() {
          overscroll *= 0.82;
          if (Math.abs(overscroll) < 0.5) { applyOverscroll(0); return; }
          applyOverscroll(overscroll);
          bounceRaf = requestAnimationFrame(tick);
        }
        bounceRaf = requestAnimationFrame(tick);
      }

      screen.addEventListener('mousedown', (e) => {
        if (e.target.closest('button, a, input, .chip, .chip-row')) return;
        swiping = true;
        startY = e.clientY;
        scrollStart = screen.scrollTop;
        lastY = startY;
        lastT = Date.now();
        velocity = 0;
        cancelAnimationFrame(momentumRaf);
        cancelAnimationFrame(bounceRaf);
        applyOverscroll(0);
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!swiping) return;
        const dy = startY - e.clientY;
        const desired = scrollStart + dy;
        const max = maxScroll();

        if (desired < 0) {
          screen.scrollTop = 0;
          applyOverscroll(-desired * RUBBER);
        } else if (desired > max) {
          screen.scrollTop = max;
          applyOverscroll(-(desired - max) * RUBBER);
        } else {
          screen.scrollTop = desired;
          applyOverscroll(0);
        }

        const now = Date.now();
        const dt = now - lastT;
        if (dt > 0) {
          velocity = (lastY - e.clientY) / dt;
          lastY = e.clientY;
          lastT = now;
        }
        e.preventDefault();
      });

      document.addEventListener('mouseup', () => {
        if (swiping) endSwipe();
      });

      function endSwipe() {
        if (!swiping) return;
        swiping = false;
        if (overscroll !== 0) {
          springBack();
        } else if (Math.abs(velocity) > 0.2) {
          startMomentum();
        }
      }

      function startMomentum() {
        let v = Math.max(-60, Math.min(60, velocity * 28));
        const friction = 0.97;

        function tick() {
          v *= friction;
          const before = screen.scrollTop;
          screen.scrollTop += v;
          const after = screen.scrollTop;
          const max = maxScroll();

          if ((after <= 0 && v < 0) || (after >= max && v > 0)) {
            applyOverscroll(overscroll + v * 0.4);
            v *= 0.9;
            if (Math.abs(v) < 0.5 || Math.abs(overscroll) >= MAX_OVER) {
              springBack();
              return;
            }
            momentumRaf = requestAnimationFrame(tick);
            return;
          }

          if (Math.abs(v) > 0.3) {
            momentumRaf = requestAnimationFrame(tick);
          }
        }
        momentumRaf = requestAnimationFrame(tick);
      }
    })();

    // Horizontal drag-to-scroll for chip rows
    (function() {
      const screen = document.querySelector('.device-frame');
      if (!screen) return;
      let row = null, dragging = false, startX, scrollL;

      screen.addEventListener('mousedown', (e) => {
        const r = e.target.closest('.chip-row');
        if (!r) return;
        row = r;
        dragging = true;
        startX = e.clientX;
        scrollL = row.scrollLeft;
        row.style.scrollBehavior = 'auto';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!dragging || !row) return;
        row.scrollLeft = scrollL - (e.clientX - startX);
      });

      document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        if (row) row.style.scrollBehavior = '';
        row = null;
      });
    })();

    function getSnapPosition() {
      const phone = document.querySelector('.phone-frame');
      const panel = document.getElementById('controlPanel');
      const phoneRect = phone.getBoundingClientRect();
      const gap = 40;
      return {
        x: phoneRect.right + gap,
        y: phoneRect.top + 56
      };
    }

    function snapPanelToPhone() {
      const panel = document.getElementById('controlPanel');
      const pos = getSnapPosition();
      panel.style.left = pos.x + 'px';
      panel.style.top = pos.y + 'px';
    }

    (function() {
      const panel = document.getElementById('controlPanel');
      const handle = document.getElementById('controlPanelHandle');
      let isDragging = false, startX, startY, panelX, panelY;
      const SNAP_DIST = 80;

      snapPanelToPhone();
      window.addEventListener('resize', () => { if (!isDragging) snapPanelToPhone(); });

      handle.addEventListener('mousedown', startDrag);
      handle.addEventListener('touchstart', startDrag, { passive: false });

      function startDrag(e) {
        if (e.target.closest('#controlPanelCollapse')) return;
        isDragging = true;
        handle.style.cursor = 'grabbing';
        panel.style.transition = 'none';
        const rect = panel.getBoundingClientRect();
        panelX = rect.left; panelY = rect.top;
        const pt = e.touches ? e.touches[0] : e;
        startX = pt.clientX - panelX; startY = pt.clientY - panelY;
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchmove', onDrag, { passive: false });
        document.addEventListener('touchend', stopDrag);
        e.preventDefault();
      }

      function onDrag(e) {
        if (!isDragging) return;
        const pt = e.touches ? e.touches[0] : e;
        let x = pt.clientX - startX, y = pt.clientY - startY;
        x = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, x));
        y = Math.max(0, Math.min(window.innerHeight - panel.offsetHeight, y));
        panel.style.left = x + 'px';
        panel.style.top = y + 'px';
        e.preventDefault();
      }

      function stopDrag() {
        isDragging = false;
        handle.style.cursor = 'grab';
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('touchend', stopDrag);

        panel.style.transition = 'left 0.35s cubic-bezier(0.32, 0.72, 0, 1), top 0.35s cubic-bezier(0.32, 0.72, 0, 1)';
        const snap = getSnapPosition();
        const rect = panel.getBoundingClientRect();
        const dx = rect.left - snap.x, dy = rect.top - snap.y;
        if (Math.sqrt(dx * dx + dy * dy) < SNAP_DIST) {
          snapPanelToPhone();
        }
      }
    })();

    // ==========================================
    // PROTO HEADER — COLLAPSE / FAB / DRAG
    // ==========================================
    const LIVE_URL = 'https://sturdy-parakeet-o3wwv73.pages.github.io/pages/st/variants-selection-logic/v1.html';

    // ==========================================
    // PROTO NOTES — populate to enable
    // ==========================================
    const PROTO_NOTES_TITLE = 'Variant Selection — State Stress Test';
    const PROTO_NOTES_HTML = `
      <p>This prototype exercises the five variant states: <strong>Has Inventory</strong>, <strong>Sold Out</strong>, <strong>Not Available</strong>, <strong>Loading</strong>, and <strong>Error</strong>.</p>
      <h4>Sold Out vs. Not Available</h4>
      <ul>
        <li><strong>Sold Out</strong> — seller plans to sell but is currently out of stock. Chip shows strikethrough, still tappable.</li>
        <li><strong>Not Available</strong> — seller does not offer this variant at all. Two approaches:
          <ol>
            <li><strong>Hidden</strong> — remove the option entirely and default to the next available combination.</li>
            <li><strong>Disabled</strong> — show the chip as disabled and alert the user.</li>
          </ol>
        </li>
      </ul>
      <p style="opacity:0.5;font-size:12px">Use the control panel to toggle between these two behaviors.</p>
    `;

    const NOTES_STORAGE_KEY = 'proto-notes-autoopen-' + location.pathname;

    function saveNotesAutoOpen() {
      const cb = document.getElementById('notesAutoOpenCb');
      if (cb.checked) {
        localStorage.setItem(NOTES_STORAGE_KEY, 'no');
      } else {
        localStorage.removeItem(NOTES_STORAGE_KEY);
      }
    }

    function shouldAutoOpenNotes() {
      return localStorage.getItem(NOTES_STORAGE_KEY) !== 'no';
    }

    // Notes panel — dropdown below button
    function positionNotesPanel() {
      const btn = document.getElementById('protoNotesBtn');
      const panel = document.getElementById('notesPanel');
      if (!btn || !panel) return;
      const r = btn.getBoundingClientRect();
      panel.style.top = (r.bottom + 8) + 'px';
      panel.style.right = (window.innerWidth - r.right) + 'px';
    }

    function toggleNotesPanel(show) {
      const panel = document.getElementById('notesPanel');
      const overlay = document.getElementById('notesOverlay');
      if (show === undefined) show = !panel.classList.contains('visible');
      if (show) {
        document.getElementById('notesPanelContent').innerHTML =
          `<div style="font-size:15px;font-weight:600;color:white;margin-bottom:10px">${PROTO_NOTES_TITLE}</div>` +
          PROTO_NOTES_HTML;
        document.getElementById('notesAutoOpenCb').checked = !shouldAutoOpenNotes();
        positionNotesPanel();
        overlay.classList.add('visible');
        requestAnimationFrame(() => panel.classList.add('visible'));
      } else {
        panel.classList.remove('visible');
        overlay.classList.remove('visible');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('notesPanel').classList.contains('visible')) toggleNotesPanel(false);
    });

    let shareToastTimer = null;
    function copyShareLink() {
      navigator.clipboard.writeText(LIVE_URL).then(() => {
        const toast = document.getElementById('protoHeaderToast');
        clearTimeout(shareToastTimer);
        toast.classList.add('visible');
        shareToastTimer = setTimeout(() => toast.classList.remove('visible'), 2000);
      });
    }

    function collapseProtoHeader() {
      document.getElementById('protoHeader').classList.add('collapsed');
      setTimeout(() => document.getElementById('protoFab').classList.add('visible'), 150);
    }
    function expandProtoHeader() {
      document.getElementById('protoFab').classList.remove('visible');
      setTimeout(() => document.getElementById('protoHeader').classList.remove('collapsed'), 100);
    }

    (function() {
      const NARROW_BP = 720;
      let wasNarrow = window.innerWidth < NARROW_BP;
      if (wasNarrow) collapseProtoHeader();

      window.addEventListener('resize', () => {
        const narrow = window.innerWidth < NARROW_BP;
        if (narrow && !wasNarrow) collapseProtoHeader();
        else if (!narrow && wasNarrow) expandProtoHeader();
        wasNarrow = narrow;
      });

      const fab = document.getElementById('protoFab');
      let dragging = false, fabX, fabY, sX, sY, moved;
      fab.addEventListener('mousedown', startFabDrag);
      fab.addEventListener('touchstart', startFabDrag, { passive: false });

      function startFabDrag(e) {
        dragging = true; moved = false;
        fab.style.cursor = 'grabbing'; fab.style.transition = 'box-shadow 0.2s ease';
        const rect = fab.getBoundingClientRect(); fabX = rect.left; fabY = rect.top;
        const pt = e.touches ? e.touches[0] : e;
        sX = pt.clientX - fabX; sY = pt.clientY - fabY;
        document.addEventListener('mousemove', onFabDrag);
        document.addEventListener('mouseup', stopFabDrag);
        document.addEventListener('touchmove', onFabDrag, { passive: false });
        document.addEventListener('touchend', stopFabDrag);
        e.preventDefault();
      }
      function onFabDrag(e) {
        if (!dragging) return;
        moved = true;
        const pt = e.touches ? e.touches[0] : e;
        let x = pt.clientX - sX, y = pt.clientY - sY;
        x = Math.max(0, Math.min(window.innerWidth - 48, x));
        y = Math.max(0, Math.min(window.innerHeight - 48, y));
        fab.style.left = x + 'px'; fab.style.top = y + 'px';
        fab.style.right = 'auto'; fab.style.bottom = 'auto';
        e.preventDefault();
      }
      function stopFabDrag() {
        dragging = false; fab.style.cursor = 'grab';
        fab.style.transition = '';
        document.removeEventListener('mousemove', onFabDrag);
        document.removeEventListener('mouseup', stopFabDrag);
        document.removeEventListener('touchmove', onFabDrag);
        document.removeEventListener('touchend', stopFabDrag);
        if (!moved) expandProtoHeader();
      }
    })();

    // ==========================================
    // INIT
    // ==========================================
    function init() {
      if (PROTO_NOTES_HTML.trim()) {
        document.getElementById('protoNotesBtn').style.display = '';
        if (shouldAutoOpenNotes()) setTimeout(() => toggleNotesPanel(true), 600);
      }
      setNotAvailMode('hidden');
      state.selections = ['9.5M', 'Black/White'];
      state.currentState = 'default';
      renderAllChips();
      renderProductInfo();
      updateImages('Black/White');
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const h = now.getHours(), m = pad(now.getMinutes());
      const ampm = h >= 12 ? 'pm' : 'am';
      const h12 = h % 12 || 12;
      document.getElementById('protoTimestamp').textContent =
        `Updated by Soh Tanaka on ${now.getMonth()+1}/${now.getDate()}/${String(now.getFullYear()).slice(2)} @ ${h12}:${m}${ampm}`;
    }
    init();
  </script>
</body>
